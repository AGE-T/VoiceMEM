# --- PyTorch: KULON lepes, sajat index-szel (nem fejezheto ki lock-sorrol) --
# A cu128 wheel a pytorch sajat indexrol erheto el, ezert a telepito kulon
# parancsban rakja fel (M0 / README Telepites 1. lepes). A harom csomag
# HIVATALOS PAROSITOTT verzioja, mind EXAKT pinelve (a v0.1.6 a
# torchvision/torchaudio verziot nem pinelte, ezert kerult be torchaudio
# 2.11.0+cu128 a torch 2.7.0 melle - inkompatibilis paros):
#   pip install torch==2.7.0 torchvision==0.22.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cu128
# A telepito a telepites utan import-val ellenorzi mindharom verziojat, es
# a VoiceMem telepitese utan ujra (guard a pip feluliras ellen).

# --- voicemem: pinned git-commit (vendor-klonbol telepul) --------------------
# A telepito a vendor/voicemem klonbol `pip install -e` telepiti; a pin a
# vendor-klon commitja (a klon SHA-ja = az alabbi URL utolso szegmense):
#   pip install git+https://github.com/xzf-thu/VoiceMem.git@<pinned-commit>

# --- huggingface_hub KONYVTAR: TELEPITESI IDOBEN kell (modell-letoltes) ----
