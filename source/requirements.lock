# a modellek models/-ba toltasere; a telepito kulon lepesben rakja fel (a
# runtime offline env-ek miatt utana mar nem hasznalja):
#   pip install "huggingface_hub"
# FIGYELEM: a [cli] extra SZANDERKOS NINCS telepitve - a Hugging Face CLI
# NEM runtime dependency (a CLI deprecation-warningjanak emoji karaktere
# CP1252 konzolon UnicodeEncodeError-t okozott - v0.1.6 release blocker).

